name: Code Analysis Basic

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build project (skip tests)
        run: mvn clean verify -DskipTests

      # Ejecutar OWASP Dependency Check usando Maven plugin
      - name: Run OWASP Dependency Check via Maven plugin
        run: mvn org.owasp:dependency-check-maven:check -Dformat=HTML

      - name: Upload OWASP Dependency Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html

      # SpotBugs análisis estático
      - name: Run SpotBugs
        run: mvn spotbugs:spotbugs -Dspotbugs.skip=false

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
