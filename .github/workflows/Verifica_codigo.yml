name: Code Analysis Basic

on:
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build project (skip tests)
        run: mvn -B clean verify -DskipTests

      # ---------- Seguridad en dependencias ----------
      - name: Run OWASP Dependency Check
        uses: jeremylong/gh-action-dependency-check@v4
        with:
          project: "mi-proyecto-serenity"
          path: "."
          format: "HTML"
          out: "dependency-check-report"

      - name: Upload dependency check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: dependency-check-report

      # ---------- Análisis de calidad: SpotBugs ----------
      - name: Static Code Analysis (SpotBugs)
        run: mvn spotbugs:spotbugs -Dspotbugs.skip=false

      - name: Upload SpotBugs report
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
